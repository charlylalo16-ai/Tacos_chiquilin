<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Chiquilín</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --rojo:#c0131b;--rojo-d:#8b0e14;--amarillo:#f5c800;--amarillo-d:#c9a200;
  --cafe:#1a0800;--cafe2:#3d1600;--cafe3:#6a2e00;
  --crema:#fff9ee;--gris:#f4efe5;--gris2:#efe9df;
  --blanco:#fff;--texto:#1a0800;--verde:#1a7a3a;--verde-l:#d4edda;
  --naranja:#e65100;--naranja-l:#ff6f00;
  --azul:#1565c0;--azul-l:#e3f2fd;
  --shadow:0 4px 24px rgba(26,8,0,0.12);
  --shadow-lg:0 12px 40px rgba(26,8,0,0.18);
  --radius:14px;--radius-lg:20px;--radius-xl:26px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--gris);color:var(--texto);min-height:100vh;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--gris);}
::-webkit-scrollbar-thumb{background:var(--cafe3);border-radius:3px;}

/* ── LOGIN ── */
#login-screen{
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(160deg,var(--cafe) 0%,#2d0a00 50%,#1a0500 100%);
  position:fixed;inset:0;z-index:1000;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 70%,rgba(192,19,27,0.15),transparent 60%),
             radial-gradient(ellipse at 70% 30%,rgba(245,200,0,0.06),transparent 50%);
}
.login-box{
  background:rgba(255,255,255,0.98);border-radius:28px;padding:36px 28px;
  width:100%;max-width:380px;
  box-shadow:0 40px 100px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.1);
  text-align:center;position:relative;z-index:1;
  animation:loginIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes loginIn{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.login-logo{
  width:88px;height:88px;border-radius:50%;
  border:4px solid var(--amarillo);
  box-shadow:0 0 0 3px var(--cafe),0 8px 32px rgba(0,0,0,0.3);
  overflow:hidden;background:#fff;margin:0 auto 16px;
}
.login-logo img{width:100%;height:100%;object-fit:cover;}
.login-title{font-family:'Bebas Neue',cursive;color:var(--cafe);font-size:32px;letter-spacing:1px;margin-bottom:2px;}
.login-sub{color:var(--cafe3);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;}
.login-label{font-size:10px;font-weight:800;color:var(--cafe3);text-transform:uppercase;letter-spacing:0.5px;display:block;text-align:left;margin-bottom:4px;}
.login-input{
  width:100%;padding:12px 14px;border-radius:12px;
  border:2px solid #e8e2da;font-family:'Nunito',sans-serif;
  font-size:15px;font-weight:700;outline:none;margin-bottom:12px;
  transition:all .2s;background:#fafaf8;
}
.login-input:focus{border-color:var(--rojo);background:#fff;box-shadow:0 0 0 3px rgba(192,19,27,0.08);}
.login-btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--rojo),var(--rojo-d));
  color:#fff;font-family:'Fredoka One',cursive;font-size:17px;cursor:pointer;
  box-shadow:0 6px 20px rgba(192,19,27,0.4);transition:all .2s;margin-top:4px;
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(192,19,27,0.5);}
.login-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:#ccc;font-size:11px;font-weight:700;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:#eee;}
.btn-google{
  width:100%;padding:12px;border-radius:12px;border:2px solid #e8e2da;
  background:#fff;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:#333;
  transition:all .2s;
}
.btn-google:hover{border-color:#4285f4;background:#f8f9ff;transform:translateY(-1px);}
.btn-google svg{width:20px;height:20px;flex-shrink:0;}
.login-error{background:#fde8e8;color:var(--rojo-d);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;margin-top:10px;display:none;text-align:left;border-left:3px solid var(--rojo);}
.login-loading{color:var(--cafe3);font-size:12px;font-weight:700;margin-top:10px;display:none;}

/* ── APP ── */
#app{display:none;}

/* ── NAV ── */
nav{
  background:linear-gradient(135deg,var(--cafe) 0%,#2d0a00 100%);
  position:sticky;top:0;z-index:200;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
  border-bottom:1px solid rgba(245,200,0,0.12);
}
.nav-header{display:flex;align-items:center;gap:11px;padding:9px 16px 0;}
.nav-logo{
  width:46px;height:46px;border-radius:50%;
  border:2.5px solid var(--amarillo);
  box-shadow:0 0 0 2px rgba(245,200,0,0.2),0 4px 12px rgba(0,0,0,0.3);
  overflow:hidden;background:#fff;flex-shrink:0;
}
.nav-logo img{width:100%;height:100%;object-fit:cover;}
.nav-title{font-family:'Bebas Neue',cursive;color:var(--amarillo);font-size:20px;letter-spacing:1px;line-height:1;}
.nav-sub{color:rgba(255,248,231,0.45);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:7px;}
.user-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
  border-radius:50px;padding:4px 10px 4px 4px;cursor:pointer;
  transition:all .2s;
}
.user-badge:hover{background:rgba(255,255,255,0.14);}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;
  background:linear-gradient(135deg,var(--amarillo),var(--amarillo-d));
  color:var(--cafe);overflow:hidden;flex-shrink:0;
}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-name{color:rgba(255,248,231,0.85);font-size:11px;font-weight:800;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logout-btn{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,248,231,0.7);font-size:14px;cursor:pointer;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.logout-btn:hover{background:rgba(192,19,27,0.3);color:#fff;}
.nav-tabs{display:flex;}
.nav-tab{
  flex:1;padding:9px 3px;border:none;background:transparent;
  font-family:'Fredoka One',cursive;font-size:11px;
  color:rgba(255,248,231,0.45);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:2px;
}
.nav-tab.active{color:var(--amarillo);border-bottom-color:var(--amarillo);}
.nav-tab:hover:not(.active):not(.locked){color:rgba(255,248,231,0.8);}
.nav-tab.locked{opacity:.25;cursor:not-allowed;}

/* ── PAGES ── */
.page{display:none;padding:14px 14px 88px;}
.page.active{display:block;}
.access-denied{
  text-align:center;padding:56px 20px;
  background:#fff;border-radius:var(--radius-xl);
  box-shadow:var(--shadow);margin-top:10px;
}
.access-denied .ico{font-size:48px;margin-bottom:10px;}
.access-denied h3{font-family:'Fredoka One',cursive;color:var(--rojo);font-size:18px;margin-bottom:6px;}
.access-denied p{color:var(--cafe3);font-size:13px;font-weight:600;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat{
  background:#fff;border-radius:var(--radius);padding:11px 8px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border-bottom:3px solid transparent;
  transition:all .25s;position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(0,0,0,0.02));pointer-events:none;}
.stat.active-filter{border-bottom-color:var(--rojo);background:linear-gradient(135deg,#fff,#fff8f8);}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.stat .icon{font-size:20px;margin-bottom:2px;}
.stat .num{font-family:'Bebas Neue',cursive;font-size:22px;line-height:1;}
.stat .lbl{font-size:8px;font-weight:800;text-transform:uppercase;color:var(--cafe3);letter-spacing:0.5px;}
.stat.s-bajo .num{color:#856404;}
.stat.s-agotado .num{color:var(--rojo);}

/* ── BOTONES ── */
.btn{padding:9px 14px;border-radius:10px;border:none;font-family:'Fredoka One',cursive;font-size:12px;cursor:pointer;transition:all .2s;}
.btn:hover{transform:translateY(-1px);}
.btn-rojo{background:linear-gradient(135deg,var(--rojo),var(--rojo-d));color:#fff;box-shadow:0 4px 12px rgba(192,19,27,0.3);}
.btn-verde{background:linear-gradient(135deg,#28a745,#1e7e34);color:#fff;box-shadow:0 4px 12px rgba(40,167,69,0.3);}
.btn-cafe{background:linear-gradient(135deg,var(--cafe2),var(--cafe));color:var(--amarillo);}
.btn-gris{background:var(--gris2);color:var(--cafe2);}
.btn-amarillo{background:linear-gradient(135deg,var(--amarillo),var(--amarillo-d));color:var(--cafe);}
.btn-sm{padding:5px 9px;font-size:10px;border-radius:7px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;transition:all .15s;}
.btn-sm:hover{transform:scale(1.06);}
.btn-edit{background:#ffc107;color:#333;}
.btn-del{background:linear-gradient(135deg,#dc3545,#b02a37);color:#fff;}
.btn-add{background:linear-gradient(135deg,#28a745,#1e7e34);color:#fff;}

/* ── TOOLBAR ── */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.toolbar input,.toolbar select{
  padding:8px 12px;border-radius:10px;border:2px solid #e2dcd4;
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  outline:none;transition:all .2s;background:#fff;
}
.toolbar input{flex:1;min-width:100px;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(192,19,27,0.08);}

/* ── TABLA ── */
.tabla-wrap{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:linear-gradient(135deg,var(--cafe),#2d0a00);color:var(--amarillo);font-family:'Fredoka One',cursive;font-size:11px;}
thead th{padding:10px 12px;text-align:left;letter-spacing:0.3px;}
tbody tr{border-bottom:1px solid rgba(26,8,0,0.05);transition:background .15s;}
tbody tr:hover{background:#faf8f5;}
tbody tr:last-child{border-bottom:none;}
tbody td{padding:9px 12px;font-size:12px;font-weight:600;vertical-align:middle;}
.badge{padding:3px 8px;border-radius:50px;font-size:9px;font-weight:800;text-transform:uppercase;}
.stock-ok{background:#d4edda;color:#155724;}
.stock-bajo{background:#fff3cd;color:#856404;}
.stock-agotado{background:#f8d7da;color:#721c24;}
.cat-bebidas{background:var(--azul-l);color:var(--azul);}
.cat-desechables{background:#f3e5f5;color:#4a148c;}
.acciones{display:flex;gap:4px;}
.empty{text-align:center;padding:36px;color:#bbb;font-weight:700;font-size:13px;}

/* ── MESAS ── */
.mesas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.mesa-card.llevar-card{grid-column:1/-1;}
.mesa-card{
  background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);
  overflow:hidden;border:2px solid transparent;transition:all .25s;
}
.mesa-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.mesa-card.ocupada{border-color:var(--rojo);}
.mesa-card.llevar{border-color:var(--naranja);}
.mesa-header{
  padding:10px 14px;display:flex;align-items:center;
  justify-content:space-between;background:var(--gris);
}
.mesa-header.ocupada{background:linear-gradient(135deg,var(--rojo),var(--rojo-d));color:#fff;}
.mesa-header.llevar{background:linear-gradient(135deg,var(--naranja),#bf360c);color:#fff;}
.mesa-num{font-family:'Fredoka One',cursive;font-size:15px;}
.mesa-total-show{font-family:'Bebas Neue',cursive;font-size:18px;color:var(--amarillo);letter-spacing:0.5px;}
.mesa-header:not(.ocupada):not(.llevar) .mesa-num{color:var(--cafe);}
.mesa-header:not(.ocupada):not(.llevar) .mesa-total-show{color:var(--cafe3);font-size:12px;font-family:'Nunito',sans-serif;font-weight:700;}
.mesa-body{padding:8px 12px;min-height:44px;}
.mesa-item{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px dashed rgba(26,8,0,0.08);font-size:11px;}
.mesa-item:last-child{border-bottom:none;}
.mesa-item .nombre{font-weight:700;flex:1;}
.mesa-item .cant{background:var(--amarillo);color:var(--cafe);padding:1px 7px;border-radius:50px;font-weight:900;font-size:10px;margin:0 5px;}
.mesa-item .precio{color:var(--verde);font-weight:800;}
.mesa-btns{padding:8px 12px;display:flex;gap:6px;background:rgba(244,239,229,0.5);border-top:1px solid rgba(26,8,0,0.05);}
.mesa-btns .btn{flex:1;font-size:10px;padding:7px 6px;}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(8px);padding:12px;}
.overlay.open{display:flex;}
.modal{
  background:#fff;border-radius:var(--radius-xl);padding:22px;
  width:100%;max-width:420px;
  box-shadow:0 30px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(0,0,0,0.05);
  animation:popIn .28s cubic-bezier(.34,1.56,.64,1);
  max-height:92vh;overflow-y:auto;
}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-family:'Fredoka One',cursive;color:var(--cafe);font-size:18px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(26,8,0,0.08);}
.modal-header h2{margin:0;}
.fg{margin-bottom:11px;}
.fg label{display:block;font-weight:800;font-size:10px;color:var(--cafe3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.fg input,.fg select{
  width:100%;padding:9px 12px;border-radius:10px;
  border:2px solid #e2dcd4;font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:700;outline:none;transition:all .2s;background:#fafaf8;
}
.fg input:focus,.fg select:focus{border-color:var(--rojo);background:#fff;box-shadow:0 0 0 3px rgba(192,19,27,0.08);}
.row2{display:flex;gap:8px;}.row2 .fg{flex:1;}
.modal-btns{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(26,8,0,0.06);}
.modal-btns .btn{flex:1;font-size:13px;padding:11px;}

/* ── PEDIDO ── */
.pedido-sec{background:var(--gris);border-radius:12px;padding:10px;margin-bottom:10px;}
.pedido-sec h4{font-family:'Fredoka One',cursive;font-size:13px;color:var(--cafe2);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.prow{
  display:flex;align-items:center;gap:7px;margin-bottom:6px;
  background:#fff;padding:8px 10px;border-radius:10px;
  box-shadow:0 2px 6px rgba(26,8,0,0.06);
}
.prow .pn{flex:1;font-weight:700;font-size:12px;}
.prow .pp{color:var(--verde);font-weight:900;font-size:11px;min-width:34px;text-align:right;}
.qty-ctrl{display:flex;align-items:center;gap:5px;}
.qty-btn{width:28px;height:28px;border-radius:50%;border:none;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.qty-btn:hover{transform:scale(1.1);}
.qty-minus{background:#fde8e8;color:var(--rojo-d);}
.qty-plus{background:#d4edda;color:var(--verde);}
.qty-num{font-family:'Bebas Neue',cursive;font-size:18px;min-width:20px;text-align:center;}
.total-bar{
  background:linear-gradient(135deg,var(--cafe),#2d0a00);
  color:var(--amarillo);border-radius:13px;
  padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;
}
.total-bar .tl{font-weight:700;font-size:12px;opacity:.75;}
.total-bar .ta{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:0.5px;}
.cobro-box{
  background:linear-gradient(135deg,#1a7a3a,#0d5e2a);
  border-radius:13px;padding:14px;margin-top:10px;color:#fff;
}
.cobro-box label{color:rgba(255,255,255,0.75);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;}
.cobro-box input{
  width:100%;padding:10px 13px;border-radius:9px;
  border:2px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.12);color:#fff;
  font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;outline:none;
  transition:border-color .2s;
}
.cobro-box input:focus{border-color:var(--amarillo);}
.cambio-display{
  background:rgba(255,255,255,0.12);border-radius:9px;
  padding:10px 13px;margin-top:9px;
  display:flex;justify-content:space-between;align-items:center;
}
.cambio-display .cl{font-size:11px;font-weight:700;opacity:.75;}
.cambio-display .ca{font-family:'Bebas Neue',cursive;font-size:24px;color:var(--amarillo);letter-spacing:0.5px;}

/* ── CAMPO CLIENTE ── */
.campo-llevar{
  background:linear-gradient(135deg,var(--naranja),#bf360c);
  border-radius:13px;padding:13px 14px;margin-bottom:10px;
  display:none;flex-direction:column;gap:8px;
}
.campo-llevar label{color:rgba(255,255,255,0.8);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:3px;}
.campo-llevar input{
  width:100%;padding:9px 11px;border-radius:8px;
  border:2px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.12);color:#fff;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;outline:none;
}
.campo-llevar input:focus{border-color:var(--amarillo);}

/* ── PRECIOS ── */
.menu-item-row{
  display:flex;align-items:center;gap:7px;
  background:#fff;border-radius:11px;padding:9px 11px;margin-bottom:7px;
  box-shadow:0 2px 8px rgba(26,8,0,0.07);transition:box-shadow .2s;
}
.menu-item-row:hover{box-shadow:0 4px 14px rgba(26,8,0,0.12);}
.menu-item-row .mn{flex:1;font-weight:700;font-size:13px;}
.menu-item-row .mp{color:var(--verde);font-weight:800;font-size:12px;}
.menu-item-row .acciones{display:flex;gap:4px;}
.precio-input{width:58px;padding:5px 7px;border-radius:7px;border:2px solid #e2dcd4;font-weight:800;font-size:13px;text-align:center;outline:none;transition:border-color .2s;}
.precio-input:focus{border-color:var(--rojo);}

/* ── HISTORIAL ── */
.historial-item{
  background:#fff;border-radius:13px;padding:12px 14px;margin-bottom:8px;
  box-shadow:var(--shadow);border-left:4px solid var(--amarillo);
  transition:all .2s;
}
.historial-item:hover{transform:translateX(3px);}
.historial-item.llevar-hist{border-left-color:var(--naranja);}
.hi-header{display:flex;justify-content:space-between;margin-bottom:4px;align-items:center;}
.hi-mesa{font-family:'Fredoka One',cursive;color:var(--rojo);font-size:13px;}
.hi-mesa.llevar{color:var(--naranja);}
.hi-total{font-family:'Bebas Neue',cursive;color:var(--verde);font-size:18px;letter-spacing:0.5px;}
.hi-hora{font-size:10px;color:#aaa;font-weight:700;}
.hi-items{font-size:11px;color:var(--cafe3);font-weight:600;margin-top:3px;line-height:1.5;}
.hi-cobro{font-size:10px;color:#666;margin-top:3px;}
.resumen-card{background:#fff;border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
.resumen-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(26,8,0,0.08);font-size:12px;font-weight:600;}
.resumen-row:last-child{border-bottom:none;font-size:14px;color:var(--verde);font-weight:900;padding-top:9px;}
.btn-fecha{
  padding:5px 12px;border-radius:50px;border:2px solid #e2dcd4;
  background:#fff;color:var(--cafe3);
  font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;
  white-space:nowrap;transition:all .2s;
}
.btn-fecha:hover{border-color:var(--rojo);color:var(--rojo);}
.btn-fecha.active{background:var(--rojo);border-color:var(--rojo);color:#fff;box-shadow:0 4px 12px rgba(192,19,27,0.3);}

/* ── USUARIOS ── */
.user-card{
  background:#fff;border-radius:var(--radius);padding:13px 15px;margin-bottom:8px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  transition:all .2s;
}
.user-card:hover{box-shadow:var(--shadow-lg);}
.user-card .uavatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;flex-shrink:0;
  background:linear-gradient(135deg,var(--amarillo),var(--amarillo-d));
  color:var(--cafe);overflow:hidden;
  box-shadow:0 3px 10px rgba(245,200,0,0.3);
}
.user-card .uavatar img{width:100%;height:100%;object-fit:cover;}
.user-card.mesero .uavatar{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:var(--azul);box-shadow:0 3px 10px rgba(21,101,192,0.15);}
.user-card .uinfo{flex:1;}
.user-card .uname{font-weight:900;font-size:14px;}
.user-card .urole{font-size:11px;font-weight:700;color:var(--cafe3);}
.role-badge{display:inline-block;padding:2px 8px;border-radius:50px;font-size:9px;font-weight:900;text-transform:uppercase;margin-left:4px;letter-spacing:0.3px;}
.role-badge.admin{background:#fde8e8;color:var(--rojo-d);}
.role-badge.mesero{background:var(--azul-l);color:var(--azul);}

/* ── TICKET ── */
#ticket-preview{
  font-family:'Courier New',monospace;font-size:12px;line-height:1.7;
  white-space:pre-wrap;background:#fafaf8;
  border:1px dashed #ddd;border-radius:10px;padding:16px;
  max-height:52vh;overflow-y:auto;
}

/* ── MESAS ADMIN ── */
.mesa-admin-row{
  display:flex;align-items:center;gap:8px;padding:8px 11px;
  background:var(--gris);border-radius:10px;margin-bottom:6px;
  border:1px solid rgba(26,8,0,0.06);
}
.mesa-admin-row span{flex:1;font-weight:700;font-size:12px;}

/* ── GASTOS ── */
.gasto-item{
  background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:7px;
  box-shadow:var(--shadow);border-left:4px solid var(--rojo);
  display:flex;align-items:center;gap:10px;
}
.gasto-item .g-ico{font-size:20px;flex-shrink:0;}
.gasto-item .g-info{flex:1;}
.gasto-item .g-desc{font-weight:800;font-size:13px;color:var(--cafe);}
.gasto-item .g-meta{font-size:11px;color:#aaa;font-weight:600;margin-top:1px;}
.gasto-item .g-monto{font-family:'Bebas Neue',cursive;font-size:20px;color:var(--rojo);letter-spacing:0.5px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:18px;right:16px;
  background:linear-gradient(135deg,var(--cafe),#2d0a00);
  color:var(--amarillo);padding:11px 20px;border-radius:12px;
  font-family:'Fredoka One',cursive;font-size:13px;
  box-shadow:0 8px 28px rgba(0,0,0,0.35);z-index:1001;display:none;
  border:1px solid rgba(245,200,0,0.2);
  animation:toastIn .3s ease;
}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── RESPONSIVE ── */
@media(min-width:640px){
  .mesas-grid{grid-template-columns:repeat(3,1fr);}
  .page{padding:20px 24px 88px;}
  .nav-header{padding:11px 24px 0;}
  .nav-tab{font-size:13px;padding:10px 8px;}
  .modal{max-width:460px;padding:28px;}
  .stats{gap:10px;}
  .stat .num{font-size:24px;}
  .stat .icon{font-size:22px;}
}
@media(min-width:1024px){
  body{background:linear-gradient(160deg,#f0ebe1,#e8e0d4);}
  .nav-header,.nav-tabs{max-width:1200px;margin:0 auto;}
  .page{max-width:1200px;margin:0 auto;padding:28px 32px 64px;}
  .mesas-grid{grid-template-columns:repeat(4,1fr);gap:16px;}
  .precios-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .nav-tab{font-size:14px;padding:12px 10px;}
  .nav-logo{width:52px;height:52px;}
  .nav-title{font-size:22px;}
  .mesa-card:hover{transform:translateY(-4px);}
}
@media(max-width:380px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .nav-tab{font-size:9px;padding:7px 1px;}
  thead th:nth-child(3),tbody td:nth-child(3),
  thead th:nth-child(5),tbody td:nth-child(5){display:none;}
}
</style>
</head>
